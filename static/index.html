<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>反推荐引擎</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0a0a0f;
      color: #e0e0e8;
      min-height: 100vh;
    }

    .hero {
      text-align: center;
      padding: 64px 24px 48px;
    }
    .hero h1 {
      font-size: 2.8rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #a78bfa, #38bdf8, #34d399);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
    }
    .hero p {
      color: #6b7280;
      font-size: 1.05rem;
      max-width: 520px;
      margin: 0 auto 40px;
      line-height: 1.6;
    }

    .input-area {
      max-width: 600px;
      margin: 0 auto;
      padding: 0 24px;
    }
    .input-row {
      display: flex;
      gap: 10px;
    }
    .bubble-input {
      flex: 1;
      padding: 14px 18px;
      background: #16161f;
      border: 1px solid #2d2d3d;
      border-radius: 12px;
      color: #e0e0e8;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .bubble-input:focus { border-color: #7c5cfc; }
    .bubble-input::placeholder { color: #4a4a5a; }

    .go-btn {
      padding: 14px 28px;
      background: linear-gradient(135deg, #7c5cfc, #38bdf8);
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.2s, transform 0.1s;
    }
    .go-btn:hover { opacity: 0.9; }
    .go-btn:active { transform: scale(0.97); }
    .go-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .hint {
      margin-top: 10px;
      font-size: 0.82rem;
      color: #4a4a5a;
      padding-left: 2px;
    }

    .status-bar {
      max-width: 600px;
      margin: 32px auto 0;
      padding: 0 24px;
      display: none;
    }
    .status-bar.visible { display: block; }
    .progress-label { color: #7c5cfc; font-size: 0.9rem; margin-bottom: 8px; }
    .progress-track {
      height: 3px;
      background: #2d2d3d;
      border-radius: 2px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #7c5cfc, #38bdf8);
      border-radius: 2px;
      width: 0%;
      transition: width 0.4s ease;
    }
    .domains-explored {
      margin-top: 12px;
      font-size: 0.8rem;
      color: #4a4a5a;
    }
    .domain-tag {
      display: inline-block;
      padding: 3px 10px;
      background: #1a1a2a;
      border-radius: 20px;
      margin: 3px 4px 3px 0;
      border: 1px solid #2d2d3d;
      color: #7c7c9a;
      font-size: 0.78rem;
    }

    .results {
      max-width: 760px;
      margin: 48px auto 80px;
      padding: 0 24px;
      display: none;
    }
    .results.visible { display: block; }
    .results-header {
      font-size: 0.85rem;
      color: #4a4a5a;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 20px;
    }

    @keyframes border-spin {
      to { --angle: 360deg; }
    }
    @property --angle {
      syntax: '<angle>';
      initial-value: 0deg;
      inherits: false;
    }

    .card {
      background: #12121a;
      border: 1px solid #1e1e2e;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 16px;
      transition: border-color 0.3s, transform 0.2s;
      position: relative;
      overflow: hidden;
    }

    .card::after {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: 17px;
      padding: 1px;
      background: conic-gradient(from var(--angle), #7c5cfc, #38bdf8, #34d399, #a78bfa, #7c5cfc);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      opacity: 0;
      transition: opacity 0.3s;
      animation: border-spin 3s linear infinite;
      pointer-events: none;
    }

    .card:hover {
      border-color: transparent;
      transform: translateY(-2px);
    }
    .card:hover::after {
      opacity: 1;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, #7c5cfc33, #38bdf833, #34d39933);
    }

    .card-domain {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #7c5cfc;
      margin-bottom: 8px;
    }
    .card-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: #d4d4e4;
      margin-bottom: 12px;
      line-height: 1.4;
    }
    .card-hook {
      font-size: 0.95rem;
      color: #9090aa;
      margin-bottom: 16px;
      line-height: 1.5;
      font-style: italic;
    }

    .card-meta {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }
    .meta-block {
      background: #0d0d15;
      border-radius: 10px;
      padding: 12px 14px;
    }
    .meta-label {
      font-size: 0.7rem;
      color: #4a4a5a;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 5px;
    }
    .meta-text {
      font-size: 0.85rem;
      color: #8a8aa0;
      line-height: 1.45;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .score-badge {
      font-size: 0.75rem;
      color: #4a4a5a;
    }
    .score-dots {
      display: inline-flex;
      gap: 3px;
      margin-left: 6px;
    }
    .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #2d2d3d;
    }
    .dot.active { background: #7c5cfc; }

    .read-link {
      padding: 8px 20px;
      background: transparent;
      border: 1px solid #2d2d3d;
      border-radius: 8px;
      color: #7c7c9a;
      text-decoration: none;
      font-size: 0.85rem;
      transition: border-color 0.2s, color 0.2s;
    }
    .read-link:hover {
      border-color: #7c5cfc;
      color: #a78bfa;
    }

    .error-msg {
      max-width: 600px;
      margin: 32px auto;
      padding: 16px 24px;
      background: #1a0a0a;
      border: 1px solid #5a1a1a;
      border-radius: 12px;
      color: #f87171;
      font-size: 0.9rem;
      display: none;
    }
    .error-msg.visible { display: block; }
  </style>
</head>
<body>

<div class="hero">
  <h1>反推荐引擎</h1>
  <p>告诉我你的信息茧房，我帮你找到你绝对不会主动发现的东西</p>
</div>

<div class="input-area">
  <div class="input-row">
    <input
      class="bubble-input"
      id="bubbleInput"
      type="text"
      placeholder="描述你的信息茧房，例如：AI、科技、创业、中国互联网"
    />
    <button class="go-btn" id="goBtn" onclick="startRecommend()">突破茧房</button>
  </div>
  <div class="hint">可以用中文或英文描述你平时读什么、关注什么</div>
</div>

<div class="status-bar" id="statusBar">
  <div class="progress-label" id="progressLabel">正在探索对立领域...</div>
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  <div class="domains-explored" id="domainsExplored"></div>
</div>

<div class="error-msg" id="errorMsg"></div>

<div class="results" id="results">
  <div class="results-header">反推荐结果</div>
  <div id="cardContainer"></div>
</div>

<script>
  async function startRecommend() {
    const bubble = document.getElementById('bubbleInput').value.trim();
    if (!bubble) return;

    const btn = document.getElementById('goBtn');
    const statusBar = document.getElementById('statusBar');
    const errorMsg = document.getElementById('errorMsg');
    const results = document.getElementById('results');

    btn.disabled = true;
    statusBar.classList.add('visible');
    errorMsg.classList.remove('visible');
    results.classList.remove('visible');
    setProgress(10, '正在分析你的信息茧房...');

    try {
      const progressInterval = animateProgress(10, 70, 8000);

      const resp = await fetch('/recommend', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({bubble})
      });

      clearInterval(progressInterval);

      if (!resp.ok) {
        const err = await resp.json();
        throw new Error(err.detail || 'Request failed');
      }

      setProgress(90, '正在生成解释...');
      const data = await resp.json();

      // show explored domains
      if (data.domains_explored?.length) {
        document.getElementById('domainsExplored').innerHTML =
          '探索了：' + data.domains_explored.map(d =>
            `<span class="domain-tag">${d}</span>`
          ).join('');
      }

      setProgress(100, '完成');
      setTimeout(() => {
        renderResults(data);
        statusBar.classList.remove('visible');
        results.classList.add('visible');
      }, 400);

    } catch (e) {
      errorMsg.textContent = '出错了：' + e.message;
      errorMsg.classList.add('visible');
      statusBar.classList.remove('visible');
    } finally {
      btn.disabled = false;
    }
  }

  function setProgress(pct, label) {
    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('progressLabel').textContent = label;
  }

  function animateProgress(from, to, duration) {
    const start = Date.now();
    return setInterval(() => {
      const elapsed = Date.now() - start;
      const frac = Math.min(elapsed / duration, 1);
      const eased = 1 - Math.pow(1 - frac, 3);
      setProgress(from + (to - from) * eased, '正在搜索对立领域内容...');
    }, 100);
  }

  function renderResults(data) {
    const container = document.getElementById('cardContainer');
    if (!data.recommendations?.length) {
      container.innerHTML = '<p style="color:#4a4a5a;text-align:center;padding:40px 0">没有找到合适的反推荐内容，试试换个描述</p>';
      return;
    }
    container.innerHTML = data.recommendations.map(item => `
      <div class="card">
        <div class="card-domain">${escHtml(item.domain)}</div>
        <div class="card-title">${escHtml(item.title)}</div>
        <div class="card-hook">"${escHtml(item.hook)}"</div>
        <div class="card-meta">
          <div class="meta-block">
            <div class="meta-label">为什么你不会自己找到</div>
            <div class="meta-text">${escHtml(item.why_wont_find)}</div>
          </div>
          <div class="meta-block">
            <div class="meta-label">隐藏的桥梁</div>
            <div class="meta-text">${escHtml(item.bridge)}</div>
          </div>
        </div>
        <div class="card-footer">
          <div class="score-badge">
            意外程度
            <span class="score-dots">
              ${Array.from({length: 10}, (_, i) =>
                `<span class="dot ${i < item.score ? 'active' : ''}"></span>`
              ).join('')}
            </span>
          </div>
          <a class="read-link" href="${escHtml(item.url)}" target="_blank" rel="noopener">阅读 →</a>
        </div>
      </div>
    `).join('');
  }

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  document.getElementById('bubbleInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') startRecommend();
  });
</script>
</body>
</html>
